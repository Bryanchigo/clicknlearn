<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Ninja | Arcade Edition</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game-container">
        <canvas id="fx-canvas"></canvas>

        <header id="hud">
            <div class="stat-box">
                <span class="stat-label">Score</span>
                <span id="score-val">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Best</span>
                <span id="high-score-val">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Time</span>
                <span id="time-val">30s</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Streak</span>
                <span id="streak-val">0x</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Lives</span>
                <span id="lives-val">❤️❤️❤️</span>
            </div>
        </header>

        <main id="play-area">
            <div id="start-screen" class="screen">
                <h1 class="title">🥷 KEYBOARD NINJA</h1>
                <p>Type the falling keys on your keyboard before time runs out!</p>
                
                <div class="mode-selector">
                    <label class="active">
                        <input type="radio" name="difficulty" value="home" checked>
                        <span>Home Row</span>
                    </label>
                    <label>
                        <input type="radio" name="difficulty" value="alpha">
                        <span>Alphabet (A-Z)</span>
                    </label>
                    <label>
                        <input type="radio" name="difficulty" value="all">
                        <span>All Keys</span>
                    </label>
                </div>

                <button id="start-btn">Start Typing ⚔️</button>
                <a href="../../index.html" class="back-link">← Back to Arcade</a>
            </div>

            <div id="end-screen" class="screen hidden">
                <h1 class="title" id="end-title" style="color: var(--error-red);">GAME OVER</h1>
                <p id="end-reason">Time is up! Here is your final performance:</p>
                
                <div class="final-stats">
                    <div class="stat-box">
                        <span class="stat-label">Final Score</span>
                        <span id="final-score">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Max Streak</span>
                        <span id="final-streak">0x</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Best Record</span>
                        <span id="final-high-score">0</span>
                    </div>
                </div>

                <button id="restart-btn">Play Again ↻</button>
                <a href="../../index.html" class="back-link">← Back to Arcade</a>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
